name: Bug report
description: Report a reproducible problem with CodeSnap
title: 'bug: '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include private code or secrets.
        Security issues must be reported privately per SECURITY.md.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Select ...
        3. Click ...
      validations:
        required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v3.0.0 or a commit SHA
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Edge
        - Firefox
        - Safari
        - Android Chrome
        - iOS Safari
        - Other
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - Editor or preview
        - Export (download or clipboard)
        - Share link
        - Import or drag-and-drop
        - PWA install or offline mode
        - Mobile layout
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screenshots, console output, or extra context
      description: Redact any sensitive code before posting.
